# fleet-sre's brain — a tool-calling-capable model.
#
# We use provider: OpenAI pointed at Ollama's OpenAI-COMPATIBLE /v1 endpoint
# (NOT provider: Ollama). Two reasons, both learned the hard way:
#   1. kagent's native Ollama path returns tool calls as TEXT for many models;
#      Ollama's /v1 surface returns structured `tool_calls` the runtime executes.
#   2. The model MUST actually emit structured tool_calls. Verified on this host:
#      qwen3:4b ✓ and nemotron ✓ do; qwen2.5-coder and qwen3:0.6b emit text ✗.
#      qwen3:4b is the sweet spot (2.5GB, Apache-2.0, the PRD's intended primary).
# The apiKey is a dummy — Ollama ignores it. On a Jetson point baseUrl at an
# in-cluster Ollama serving qwen3:1.7b.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: fleet-brain
  namespace: kagent
spec:
  provider: OpenAI
  model: qwen3:4b
  apiKeySecret: fleet-openai-key
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://host.k3d.internal:11434/v1
