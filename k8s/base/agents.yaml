# Orchestrator + 3 cognition agents. Same image, env-parameterized.
# Each mounts the shared demo tokens secret and loads its own identity.
apiVersion: apps/v1
kind: Deployment
metadata: { name: orchestrator, namespace: warehouse }
spec:
  replicas: 1
  selector: { matchLabels: { app: orchestrator } }
  template:
    metadata: { labels: { app: orchestrator, tier: agent } }
    spec:
      containers:
        - name: agent
          image: physical-ai-demo/agent:local
          command: ["python", "-m", "agents.orchestrator"]
          ports: [{ containerPort: 9000 }]
          env:
            - { name: PORT, value: "9000" }
            - { name: GATEWAY_URL, value: http://gateway:3000 }
            - { name: LLM_BASE_URL, value: http://gateway:4000/v1 }
            - { name: LLM_MODEL, value: robot-brain }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector:4318 }
          volumeMounts: [{ name: jwt, mountPath: /jwt, readOnly: true }]
          readinessProbe: { httpGet: { path: /healthz, port: 9000 } }
      volumes: [{ name: jwt, secret: { secretName: agent-tokens } }]
---
apiVersion: v1
kind: Service
metadata: { name: orchestrator, namespace: warehouse }
spec:
  selector: { app: orchestrator }
  ports: [{ port: 9000, targetPort: 9000 }]
---
